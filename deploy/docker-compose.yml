# Harvanera на сервере витрин. Папка (например /home/routa) с этим файлом, setup.sh, env.example и .env.
# Первый запуск: sudo sh setup.sh — создаёт .env и data/, потом запускает контейнер (см. DEPLOY.md).
# Обновление: CI при пуше в dev — пишет в .env REGISTRY_IMAGE и IMAGE_TAG, потом docker compose pull && up -d.
#
# Контейнер отвечает по HTTP на 127.0.0.1:$SITE_PORT; домен и TLS — у прокси перед ним.
# База SQLite — ./data/app.db, бэкапы — ./data/backups/ (переживают обновления).
services:
  web:
    image: ${HARVANERA_IMAGE:-gitlab.q-tech.host:5050/showcases/routa}:${SITE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/app.db
    volumes:
      - ./data:/data
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "5" }
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
 
      # HTTPS Router
      - "traefik.http.routers.harvanera-secure.rule=Host(`${SITE_HOST:?set SITE_HOST in .env}`)"
      - "traefik.http.routers.harvanera-secure.entrypoints=websecure"
      - "traefik.http.routers.harvanera-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.harvanera-secure.service=harvanera-secure"
 
      # Service definition
      - "traefik.http.services.harvanera-secure.loadbalancer.server.port=3000"
 
      # HTTP Router (for redirection)
      - "traefik.http.routers.harvanera-http.rule=Host(`${SITE_HOST}`)"
      - "traefik.http.routers.harvanera-http.entrypoints=web"
      - "traefik.http.routers.harvanera-http.middlewares=redirect-to-https"
      - "traefik.http.routers.harvanera-http.service=noop@internal"

      # www.SITE_HOST → SITE_HOST (301). Сертификат на www Traefik получает сам.
      - "traefik.http.routers.harvanera-www.rule=Host(`www.${SITE_HOST}`)"
      - "traefik.http.routers.harvanera-www.entrypoints=websecure"
      - "traefik.http.routers.harvanera-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.harvanera-www.middlewares=harvanera-to-apex"
      - "traefik.http.routers.harvanera-www.service=noop@internal"
      - "traefik.http.routers.harvanera-www-http.rule=Host(`www.${SITE_HOST}`)"
      - "traefik.http.routers.harvanera-www-http.entrypoints=web"
      - "traefik.http.routers.harvanera-www-http.middlewares=harvanera-to-apex"
      - "traefik.http.routers.harvanera-www-http.service=noop@internal"
      - "traefik.http.middlewares.harvanera-to-apex.redirectregex.regex=^https?://www\\.(.+)"
      - "traefik.http.middlewares.harvanera-to-apex.redirectregex.replacement=https://$${1}"
      - "traefik.http.middlewares.harvanera-to-apex.redirectregex.permanent=true"

networks:
  traefik-net:
    external: true

