stages:
  - build
  - deploy

build:
  image: docker:27.5.1
  stage: build
  tags: [showcases]
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  before_script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    # the runner's Docker keeps the layer cache between jobs, so no --cache-from is needed
    - docker build --pull --build-arg CI_COMMIT_SHA="$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE:latest" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" apps/web
    - docker push "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  after_script:
    - docker logout "$CI_REGISTRY" || true
  rules:
    - if: $SUPPORT_CMD
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy:
  image: alpine:latest
  stage: deploy
  tags: [showcases]
  resource_group: production
  needs:
    - build
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts
    - |
      printf 'Host deploy\n  HostName %s\n  User %s\n  Port %s\n' \
        "$SSH_HOST" "$SSH_USER" "${SSH_PORT:-22}" > ~/.ssh/config
  script:
    # 1. files: compose + data dir for SQLite (owner uid 1000 = user "node" in the image)
    - ssh deploy "mkdir -p '$DEPLOY_PATH/data/backups' && chown -R 1000:1000 '$DEPLOY_PATH/data'"
    - cat deploy/docker-compose.yml | ssh deploy "cat > '$DEPLOY_PATH/docker-compose.yml'"

    # 2. .env: from the ENV_FILE variable if present, otherwise keep what is on the server
    - |
      if [ -n "${ENV_FILE:-}" ] && [ -f "$ENV_FILE" ]; then
        echo "writing .env from ENV_FILE"
        ssh deploy "umask 077 && cat > '$DEPLOY_PATH/.env'" < "$ENV_FILE"
      fi
    - |
      if ! ssh deploy "test -f '$DEPLOY_PATH/.env'"; then
        echo "ERROR: no .env on the server and ENV_FILE is not set"
        exit 1
      fi

    # 3. pin the image version in the server's .env
    - |
      ssh deploy "cd '$DEPLOY_PATH' && { grep -v -E '^(HARVANERA_IMAGE|SITE_TAG)=' .env || true; printf 'HARVANERA_IMAGE=%s\nSITE_TAG=%s\n' '$CI_REGISTRY_IMAGE' '$CI_COMMIT_SHORT_SHA'; } > .env.new && chmod 600 .env.new && mv .env.new .env"

    # 4. registry login on the server (password goes through stdin)
    - echo "$CI_REGISTRY_PASSWORD" | ssh deploy "docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY'"

    # 5. pull and restart
    - ssh deploy "cd '$DEPLOY_PATH' && docker compose pull && docker compose up -d --remove-orphans"

    # 6. smoke check: wait for the container HEALTHCHECK from the Dockerfile to become healthy (~90s)
    - |
      ssh deploy "cd '$DEPLOY_PATH' && CID=\$(docker compose ps -q web); for i in \$(seq 1 18); do st=\$(docker inspect --format '{{.State.Health.Status}}' \"\$CID\" 2>/dev/null); echo \"health: \$st\"; [ \"\$st\" = healthy ] && exit 0; sleep 5; done; docker compose ps; docker compose logs --tail=50 web; exit 1"

    # 7. cleanup
    - ssh deploy "docker image prune -f"
  rules:
    - if: $SUPPORT_CMD
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: production
# Диагностика почты на сервере (только чтение, запуск вручную). Скрипт — deploy/mail-check.sh.
mail-check:
  image: alpine:latest
  stage: deploy
  tags: [showcases]
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts
    - |
      printf 'Host deploy\n  HostName %s\n  User %s\n  Port %s\n' \
        "$SSH_HOST" "$SSH_USER" "${SSH_PORT:-22}" > ~/.ssh/config
  script:
    - ssh deploy "cd '$DEPLOY_PATH' && sh -s" < deploy/mail-check.sh
  rules:
    - if: $SUPPORT_CMD
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true

# Команды поддержки на сервере (npm run account|refund|contact|notice|evidence|db:backup).
# Запуск: Build → Pipelines → Run pipeline на dev с переменной SUPPORT_CMD, например
# `account verify-email x@example.com` или `refund reject abc12 "duplicate payment"`.
# Сборки и деплоя такой пайплайн не делает. Скрипт — deploy/support.sh.
support:
  image: alpine:latest
  stage: deploy
  tags: [showcases]
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts
    - |
      printf 'Host deploy\n  HostName %s\n  User %s\n  Port %s\n' \
        "$SSH_HOST" "$SSH_USER" "${SSH_PORT:-22}" > ~/.ssh/config
  script:
    # Аргументы разбирает shell на сервере — кавычки работают; ; | & ` $ < > запрещены.
    - |
      case "$SUPPORT_CMD" in *[\;\|\&\`\$\<\>]*) echo "SUPPORT_CMD: запрещённые символы"; exit 1 ;; esac
    - ssh deploy "cd '$DEPLOY_PATH' && sh -s -- $SUPPORT_CMD" < deploy/support.sh
  rules:
    - if: $SUPPORT_CMD && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
