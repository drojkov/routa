# Harvanera на сервере витрин. Папка (например /home/harvanera) с этим файлом, setup.sh, env.example и .env.
# Первый запуск: sudo sh setup.sh — создаёт .env и data/, потом запускает контейнер (см. DEPLOY.md).
# Обновление: docker compose pull && docker compose up -d (или кнопка deploy:production в GitLab).
#
# Контейнер отвечает по HTTP на 127.0.0.1:$SITE_PORT; домен и TLS — у прокси перед ним.
# База SQLite — ./data/app.db, бэкапы — ./data/backups/ (переживают обновления).
services:
  web:
    image: ${HARVANERA_IMAGE:-gitlab.q-tech.host:5050/v.davlitbaev/routa}:${SITE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/app.db
    ports:
      - 127.0.0.1:${SITE_PORT:-3070}:3000
    volumes:
      - ./data:/data
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "5" }
