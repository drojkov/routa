stages:
  - build
  - deploy

variables:
  IMAGE_NAME: harvanera
  BUILD_CONTEXT: apps/web

build:
  image: docker:27.5.1
  stage: build
  tags: [showcases]
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  before_script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    # the runner's Docker keeps the layer cache between jobs, so no --cache-from is needed
    - IMG="$CI_REGISTRY_IMAGE/$IMAGE_NAME"
    - docker build --pull --build-arg CI_COMMIT_SHA="$CI_COMMIT_SHA" -t "$IMG:latest" -t "$IMG:$CI_COMMIT_SHORT_SHA" "$BUILD_CONTEXT"
    - docker push "$IMG:latest"
    - docker push "$IMG:$CI_COMMIT_SHORT_SHA"
  after_script:
    - docker logout "$CI_REGISTRY" || true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy:
  image: alpine:latest
  stage: deploy
  tags: [showcases]
  resource_group: production
  needs:
    - build
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts
    - |
      printf 'Host deploy\n  HostName %s\n  User %s\n  Port %s\n' \
        "$SSH_HOST" "$SSH_USER" "${SSH_PORT:-22}" > ~/.ssh/config
  script:
    # 1. files: compose file
    - ssh deploy "mkdir -p '$DEPLOY_PATH'"
    - cat "${COMPOSE_SRC:-deploy/docker-compose.yml}" | ssh deploy "cat > '$DEPLOY_PATH/docker-compose.yml'"

    # 2. .env: from the ENV_FILE variable if present, otherwise keep what is on the server
    - |
      if [ -n "${ENV_FILE:-}" ] && [ -f "$ENV_FILE" ]; then
        echo "writing .env from ENV_FILE"
        ssh deploy "umask 077 && cat > '$DEPLOY_PATH/.env'" < "$ENV_FILE"
      fi
    - |
      if ! ssh deploy "test -f '$DEPLOY_PATH/.env'"; then
        echo "ERROR: no .env on the server and ENV_FILE is not set"
        exit 1
      fi

    # 3. pin the image version in the server's .env
    - |
      ssh deploy "cd '$DEPLOY_PATH' && { grep -v -E '^(REGISTRY_IMAGE|IMAGE_TAG)=' .env || true; printf 'REGISTRY_IMAGE=%s\nIMAGE_TAG=%s\n' '$CI_REGISTRY_IMAGE' '$CI_COMMIT_SHORT_SHA'; } > .env.new && chmod 600 .env.new && mv .env.new .env"

    # 4. registry login on the server (password goes through stdin)
    - echo "$CI_REGISTRY_PASSWORD" | ssh deploy "docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY'"

    # 5. pull and restart
    - ssh deploy "cd '$DEPLOY_PATH' && docker compose pull && docker compose up -d --remove-orphans"

    # 6. smoke check: wait for the container HEALTHCHECK from the Dockerfile to become healthy (~90s)
    - |
      ssh deploy "cd '$DEPLOY_PATH' && SVC='${COMPOSE_SERVICE:-web}'; CID=\$(docker compose ps -q \"\$SVC\"); for i in \$(seq 1 18); do st=\$(docker inspect --format '{{.State.Health.Status}}' \"\$CID\" 2>/dev/null); echo \"health: \$st\"; [ \"\$st\" = healthy ] && exit 0; sleep 5; done; docker compose ps; docker compose logs --tail=50 \"\$SVC\"; exit 1"

    # 7. cleanup
    - ssh deploy "docker image prune -f"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: production